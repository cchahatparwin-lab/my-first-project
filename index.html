<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Big Sister 🎂</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #d9e7ff);
            overflow: hidden;
        }

        .card {
            width: 90%;
            max-width: 600px;
            padding: 40px 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.18);
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 42px;
            color: #e83e8c;
            margin: 10px 0;
        }

        h2 {
            font-size: 30px;
            color: #7b4ab8;
            margin: 10px 0 20px;
        }

        .message {
            font-size: 19px;
            line-height: 1.6;
            color: #444;
        }

        .teddy {
            font-size: 100px;
            animation: bounce 1.5s infinite;
            margin: 10px;
        }

        .cake {
            font-size: 65px;
            margin: 10px;
        }

        .balloon {
            position: fixed;
            bottom: -120px;
            font-size: 55px;
            animation: fly 8s linear infinite;
        }

        .b1 {
            left: 8%;
            animation-delay: 0s;
        }

        .b2 {
            left: 25%;
            animation-delay: 2s;
        }

        .b3 {
            left: 70%;
            animation-delay: 1s;
        }

        .b4 {
            left: 88%;
            animation-delay: 3s;
        }

        .heart {
            font-size: 30px;
            animation: heartbeat 1s infinite;
        }

        button {
            margin-top: 20px;
            padding: 13px 25px;
            border: none;
            border-radius: 25px;
            background: #e83e8c;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        @keyframes fly {
            0% {
                transform: translateY(0) rotate(0deg);
            }

            100% {
                transform: translateY(-120vh) rotate(15deg);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        @keyframes heartbeat {
            50% {
                transform: scale(1.3);
            }
        }
    </style>
</head>

<body>

    <!-- Floating balloons -->
    <div class="balloon b1">🎈</div>
    <div class="balloon b2">🎈</div>
    <div class="balloon b3">🎈</div>
    <div class="balloon b4">🎈</div>

    <!-- Birthday Card -->
    <div class="card">

        <div class="heart">💖 ✨ 💖</div>

        <div class="teddy">🧸</div>

        <h1>🎉 Happy Birthday 🎉</h1>

        <h2>Big Sister 💕</h2>

        <div class="cake">🎂</div>

        <p class="message">
            Dear Big Sister 💖<br><br>
            Wishing you a very Happy Birthday! 🎈<br>
            May your day be filled with happiness,
            laughter and lots of beautiful memories. ✨
            <br><br>
            You are very special! 🥰
        </p>

        <div class="heart">💗 💕 💗</div>

        <button onclick="showMessage()">
            🎁 Click for a Surprise 🎁
        </button>

        <p id="surprise"></p>

    </div>

    <script>
        function showMessage() {
            document.getElementById("surprise").innerHTML =
                "🎊 Happy Birthday Big Sister! 🎊<br>Lots of love! 💖🧸🎈";
        }
    </script>

</body>
</html>
